name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads version from package.json `packageManager`

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # webcrack's engine range is 22/24; the rest is fine here too
          cache: pnpm

      # --ignore-scripts skips webcrack's optional `isolated-vm` native build
      # (not needed for tests/build; see issue #2).
      - run: pnpm install --ignore-scripts

      - run: pnpm -r test
      - run: pnpm -r build

      # Typechecks the code no package build covers: the five headless smoke
      # scripts and the mappings-pipeline `.mjs` sources. Both are plain `.mjs`,
      # so `pnpm -r build` (per-package `tsc -p` plus next/vite build) never read
      # them and vitest never imports them. See issue #25 and
      # tooling/typecheck/tsconfig.smokes.json for why it is non-strict.
      #
      # Runs AFTER build: it typechecks scripts that import from workspace
      # packages, which must have emitted their declarations first.
      - run: pnpm -r lint
