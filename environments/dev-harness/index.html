<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TSPML dev harness — PolyTrack</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0d1117; color: #c9d1d9;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      main { display: flex; flex-direction: column; height: 100vh; }
      header { display: flex; align-items: baseline; gap: 16px; padding: 10px 16px;
        border-bottom: 1px solid #21262d; }
      h1 { font-size: 15px; margin: 0; font-weight: 600; }
      h1 code { color: #39ff14; }
      #status { font: 12px ui-monospace, Menlo, monospace; color: #9aa4b2; }
      #status[data-kind="ok"] { color: #3fb950; }
      #status[data-kind="warn"] { color: #d29922; }
      #status[data-kind="err"] { color: #f85149; }
      #game { flex: 1; width: 100%; border: 0; background: #000; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>TSPML dev harness <code>✔</code></h1>
        <div id="status" data-kind="warn">starting…</div>
      </header>
      <iframe id="game" title="PolyTrack (transformed)" allow="autoplay; fullscreen; gamepad; pointer-lock" allowfullscreen></iframe>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
